const TARGETS_NUT = {

  // Slight calorie reduction on non-training days, protein maintained to protect muscle

const TAG_COLOR = { Foundation:"#f0a500", Build:"#4db8a0", Deload:"#8fbc8f", Strength:"#7bc67e", Peak:"#e05c3a", "Test Week":"#ffb700" };

function r5(n) { return Math.round(n / 5) * 5; }

function buildWorkouts(wi) {
  const w = W[wi];
  const isDeload = w.tag === "Deload";
  const isPeak = w.tag === "Peak";
  const isTest = w.tag === "Test Week";
  const sq = MAXES.sq, db = MAXES.db, dl = MAXES.dl;

  // ── HEAVY DAY sets/reps: low rep, high load, long rest ──────────────────
  // Primary: 5x3-5 | Accessory compound: 4x4-6 | Isolation: 3x8
  const hPrimary  = isDeload?"4x4": isPeak?"5x3": isTest?"Ramp to 1RM":"5x4";
  const hCompound = isDeload?"3x5": isPeak?"4x4":"4x5";
  const hIso      = "3x8";

  // ── VOLUME DAY sets/reps: higher rep, moderate load, short rest ──────────
  // Primary: 4x10-12 | Accessory compound: 4x10 | Isolation: 3x15
  const vPrimary  = isDeload?"3x10":"4x10";
  const vCompound = isDeload?"3x10":"4x10";
  const vIso      = "3x15";

  // ── HEAVY LEG sets/reps (Wed) ────────────────────────────────────────────
  const sqHeavy   = isDeload?"3x5": isPeak?"5x3": isTest?"Ramp to 1RM":"5x4";

  // ── VOLUME LEG sets/reps (Sat) ───────────────────────────────────────────
  const sqVol     = isDeload?"3x12":"4x12";

  const testRampSq = r5(sq*0.60)+"→"+r5(sq*0.75)+"→"+r5(sq*0.85)+"→"+r5(sq*0.93)+"→MAX";
  const testRampDl = r5(dl*0.60)+"→"+r5(dl*0.75)+"→"+r5(dl*0.85)+"→"+r5(dl*0.93)+"→MAX";
  const testRampDb = r5(db*0.70)+"→"+r5(db*0.82)+"→"+r5(db*0.90)+"→"+r5(db*0.94)+"→MAX";

  // Load multipliers
  // Heavy days: full weekly pct off estimated 1RM
  // Volume days DB: back off 12% to hit higher reps
  // Volume days DL-based (rows): use direct % of DL 1RM — no double discount
  const hLoad   = w.db;
  const vLoad   = w.db * 0.88;
  const hDlLoad = w.dl;
  // Volume pull loads as direct fraction of DL 1RM (not pct-of-pct)
  const vRowLoad  = 0.55;  // barbell row vol: ~55% DL 1RM
  const hRowLoad  = 0.60;  // pendlay row heavy: ~60% DL 1RM
  const vSARLoad  = 0.65;  // single-arm DB row vol: ~65% DB 1RM

  return {
    Monday: {
      label:"PUSH — Heavy", color:"#f0a500",
      warmup:{ type:"Row Machine", dur:"10–12 min", note:"Build to ~2:10/500m" },
      blocks:[
        { name:"Primary Push — Heavy Compound", exercises:[
          { name:"DB Bench Press",          sets: isTest?testRampDb:hPrimary,  load: isTest?testRampDb: r5(db*hLoad)+"lb/hand",       note: isTest?"5→3→2→1→1RM. Rest 4 min top sets.":"Rest 3 min. 3sec lower, explode up." },
          { name:"Incline DB Press",        sets: hCompound,                   load: r5(db*0.82*hLoad)+"lb/hand",                     note:"Rest 2–3 min. Heavy + controlled." },
          { name:"Seated DB Shoulder Press",sets: hCompound,                   load: r5(db*0.62*hLoad)+"lb/hand",                     note:"Rest 2 min. Press to failure on last set." },
        ]},
        { name: isTest ? "Maintenance — Stay Loose" : "Accessory Push — Strength", exercises: isTest ? [
          { name:"Incline DB Press",        sets:"3x6",   load:"Moderate — not to failure", note:"Stay loose" },
          { name:"Lateral Raise",           sets:"2x12",  load:"Light-moderate", note:"Maintenance only" },
          { name:"Face Pull",               sets:"2x12",  load:"Light",          note:"Shoulder health" },
        ] : [
          { name:"Cable Chest Fly",         sets: hIso,   load:"Heavy — 8 hard reps",  note:"Feel the stretch, hold 1sec at peak" },
          { name:"Lateral Raise",           sets: hIso,   load:"Controlled — heavier than volume day", note:"" },
          { name:"Tricep Pushdown (rope)",  sets: hIso,   load:"Heavy",                note:"" },
        ]},
        { name:"Core", exercises:[
          { name:"Pallof Press",  sets: isTest?"2x10 each":"3x10 each", load:isTest?"Moderate":"Heavy band/cable", note:"" },
          { name:"Ab Wheel",      sets: isTest?"2x8":"3x8",             load:"",                 note:"Slow and controlled" },
        ]},
      ],
      note: isTest ? "TEST WEEK — DB Press is the main event. Everything else is maintenance only." : "HEAVY day — low reps, max load, full rest. Rest 3 min on primary, 2 min on compounds.",
    },
    Tuesday: {
      label:"PULL — Volume", color:"#4db8a0",
      warmup:{ type:"Stationary Bike", dur:"10–12 min", note:"Zone 2 ~90rpm, keep it easy" },
      blocks:[
        { name:"Primary Pull — Volume", exercises:[
          { name:"Barbell Row",                    sets: vPrimary,  load: r5(dl*vRowLoad*w.dl)+"lb",         note:"Smooth reps, no jerking. Rest 90sec." },
          { name:"Weighted Pull-Up / Lat Pulldown",sets: vCompound, load:"BW or moderate stack — full ROM", note:"Rest 90sec. Squeeze at top." },
          { name:"Seated Cable Row (wide grip)",   sets: vCompound, load:"Moderate — 10 smooth reps",       note:"Rest 90sec. Elbows back, chest up." },
        ]},
        { name:"Accessory Pull — Pump", exercises:[
          { name:"Single-Arm DB Row",    sets: vIso,  load: r5(db*vSARLoad*w.db)+"lb", note:"Slow eccentric, 2sec lower" },
          { name:"Rear Delt Fly (cable)",sets: vIso,  load:"Light-moderate",          note:"15 controlled reps" },
        ]},
        { name:"Bicep Block — Dedicated", exercises: isTest ? [
          { name:"EZ Bar Curl",              sets:"3x8",  load:"Moderate",               note:"Maintenance — not to failure" },
        ] : [
          { name:"EZ Bar Curl",              sets:"4x8",  load: r5(db*0.38*w.db)+"lb",  note:"Full ROM — dead hang at bottom, squeeze at top" },
          { name:"Incline DB Curl",          sets:"3x10", load: r5(db*0.25*w.db)+"lb",  note:"Supinate on the way up — hits long head" },
          { name:"Cable Curl (rope or bar)", sets:"3x12", load:"Moderate",               note:"Constant tension — 3sec eccentric" },
        ]},
        { name:"Core", exercises:[
          { name:"Cable External Rotation", sets:"2x15 each", load:"Light", note:"Rotator cuff health" },
          { name:"Hanging Knee Raise",      sets:"3x15",      load:"",      note:"" },
        ]},
      ],
      note: isTest ? "TEST WEEK — Moderate weights only, nothing to failure. Staying loose between Monday press test and Wednesday squat test." : "VOLUME day — moderate weight, higher reps, 60–90sec rest. Keep the pump going.",
    },
    Wednesday: {
      label:"LEGS (Squat Heavy) + Swim", color:"#7bc67e",
      warmup:{ type:"Dynamic Warm-Up", dur:"10 min", note:"Hip circles, leg swings, goblet squat x10 @ 35lb" },
      blocks:[
        { name:"Squat Block — Heavy", exercises:[
          { name:"Back Squat",                sets: sqHeavy, load: isTest?testRampSq: r5(sq*w.sq)+"lb",        note: isTest?"5→3→2→1→1RM. Rest 5 min top sets.":"Belt at top sets. Rest 3–4 min." },
          { name:"Pause Squat (2sec)",        sets: isTest?"—":hCompound, load: isTest?"Save energy": r5(sq*0.75*w.sq)+"lb", note:"2sec pause at bottom. Builds strength out of the hole." },
          { name:"Front Squat / Goblet Squat",sets: isTest?"—":hIso,      load: isTest?"Save energy": r5(sq*0.50*w.sq)+"lb", note:"Quad + core emphasis. Rest 2 min." },
        ]},
        { name: isTest ? "Maintenance — Stay Loose" : "Accessory Legs", exercises: isTest ? [
          { name:"Leg Press",           sets:"3x8",   load:"Moderate — not to failure", note:"Stay loose, save energy" },
          { name:"Standing Calf Raise", sets:"3x12",  load:"Moderate",                  note:"" },
        ] : [
          { name:"Barbell Hip Thrust",    sets:"4x6",        load: r5(MAXES.sq*0.55*w.sq)+"lb",  note:"Heavy — drive through heel, squeeze glute at top. Rest 2 min." },
          { name:"Leg Press",             sets:"4x8",         load:"Heavy — 8 hard reps",        note:"Rest 2 min" },
          { name:"Standing Calf Raise",   sets:"4x12",        load:"Heavy",                      note:"Run/bike carry-over" },
        ]},
        { name:"Core + Mobility", exercises:[
          { name:"Dead Bug",                    sets: isTest?"2x8 each":"3x8 each",       load:"", note:"" },
          { name:"Hip Flexor + Pigeon Stretch", sets:"2 min each side",load:"", note: isTest?"Prep for Friday DL":"Pre-swim prep" },
        ]},
      ],
      note: isTest ? "TEST WEEK — Squat is the main event. No swim today — come back fresh for deadlift Friday." : "HEAVY squat day — low reps, full rest. SWIM after — 1,000–1,500m.",
    },
    Thursday: {
      label:"PUSH — Volume", color:"#f0a500",
      warmup:{ type:"Row Machine", dur:"10–12 min", note:"Steady ~2:20/500m — easy pace" },
      blocks:[
        { name:"Primary Push — Volume", exercises:[
          { name:"DB Bench Press",   sets: vPrimary,  load: r5(db*0.80*vLoad)+"lb/hand", note:"10 controlled reps. Rest 90sec. Feel every rep." },
          { name:"DB Incline Press", sets: vCompound, load: r5(db*0.70*vLoad)+"lb/hand", note:"Rest 90sec. Full ROM, slow on the way down." },
          { name:"Cable Chest Press",sets: vCompound, load:"Moderate — 10 smooth reps",  note:"Rest 90sec. Squeeze at peak contraction." },
        ]},
        { name:"Shoulder Volume — Pump", exercises:[
          { name:"Arnold Press",             sets: vIso,  load: r5(db*0.38*vLoad)+"lb/hand", note:"Slow rotation — 15 reps" },
          { name:"Lateral Raise (drop set)", sets:"3x15 drop to 10 more", load:"",             note:"No rest on drop — straight into lighter set" },
          { name:"Front Raise (plate)",      sets: vIso,  load:"25–35lb plate",               note:"" },
        ]},
        { name:"Tricep + Core — Pump", exercises:[
          { name:"Skull Crusher",             sets: vIso,       load:"Moderate",    note:"Slow eccentric" },
          { name:"Overhead Tricep Extension", sets: vIso,       load:"",            note:"Full stretch at bottom" },
          { name:"Plank Variations",          sets:"3x45 sec",  load:"",            note:"" },
        ]},
      ],
      note: isTest ? "TEST WEEK — Moderate weights, nothing to failure. Keeping blood moving between squat and deadlift test days." : "VOLUME day — higher reps, moderate weight, 60–90sec rest. Chase the pump.",
    },
    Friday: {
      label:"PULL — Heavy (Deadlift)", color:"#4db8a0",
      warmup:{ type:"Stationary Bike", dur:"10–12 min", note:"Build to Zone 3 last 3 min — primes posterior chain" },
      blocks:[
        { name:"Deadlift Block — Heavy", exercises:[
          { name:"Conventional Deadlift", sets: isTest?"Ramp to 1RM": isDeload?"3x4":isPeak?"4x3":"5x4", load: isTest?testRampDl: r5(dl*hDlLoad)+"lb", note: isTest?"5→3→2→1→1RM. Rest 5 min before final.":"Belt + chalk at top sets. Rest 3–4 min." },
          { name:"Romanian Deadlift",     sets: hCompound, load: r5(dl*0.62*w.dl)+"lb",    note:"Rest 2–3 min. Slow eccentric — feel the hamstrings load." },
          { name:"Trap Bar Deadlift",     sets: hCompound, load: r5(dl*0.82*w.dl)+"lb",    note:"Rest 2–3 min. Drive through the floor." },
        ]},
        { name: isTest ? "Maintenance — Stay Loose" : "Heavy Pull Accessory", exercises: isTest ? [
          { name:"Romanian Deadlift",  sets:"3x6",   load: r5(dl*0.55*w.dl)+"lb",  note:"Light — hip hinge maintenance only" },
          { name:"Pendlay Row",        sets:"2x6",   load:"Moderate",               note:"Stay loose, not to failure" },
        ] : [
          { name:"Weighted Pull-Up",  sets: hCompound, load:"BW + 35–45lb",                 note:"Rest 2 min. Low reps, full hang." },
          { name:"Pendlay Row",       sets: hCompound, load: r5(dl*hRowLoad*w.dl)+"lb",       note:"Rest 2 min. Dead stop each rep — explosive pull." },
        ]},
        { name:"Grip + Core", exercises:[
          { name:"Farmer Carry",  sets: isTest?"3x40 yds":"4x40 yds", load: r5(db*0.88*w.db)+"lb/hand",  note:"Grip maintenance" },
          { name:"Hanging L-Sit", sets: isTest?"2x15 sec":"3x15 sec", load:"",                            note:"" },
        ]},
      ],
      note: isTest ? "TEST WEEK — Deadlift is the main event. Light accessories only — you earned this." : "HEAVY pull day — low reps, max load. Rest 3–4 min on all primary lifts.",
    },
    Saturday: {
      label:"LEGS — Volume + Swim", color:"#7bc67e",
      warmup:{ type:"Dynamic Warm-Up", dur:"10 min", note:"Banded walk, monster walk, light leg press x20" },
      blocks:[
        { name:"Squat Volume", exercises:[
          { name:"Back Squat",            sets: sqVol,    load: r5(sq*0.72*w.sq)+"lb",      note:"12 reps — endurance strength. Rest 90sec." },
          { name:"Hack Squat / Leg Press",sets:"4x12",    load:"Moderate — 12 hard reps",   note:"Rest 90sec." },
          { name:"Walking Lunge (DB)",    sets:"3x16 steps",load: r5(db*0.35*vLoad)+"lb/hand",note:"8 each leg — continuous, no rest between legs" },
        ]},
        { name:"Posterior Chain — Pump", exercises:[
          { name:"Glute Bridge (DB or Barbell)", sets:"4x15", load: r5(MAXES.sq*0.40*w.sq)+"lb", note:"Higher rep volume — squeeze 1sec at top, controlled lower" },
          { name:"Leg Curl",        sets:"4x12",    load:"Moderate",              note:"2sec hold at peak contraction" },
        ]},
        { name:"Calf + Mobility", exercises:[
          { name:"Seated Calf Raise",    sets:"4x20", load:"",      note:"" },
          { name:"Hip + Ankle Mobility", sets:"10 min",load:"",     note:"Pre-swim prep" },
        ]},
      ],
      note: isTest ? "TEST WEEK — Light leg work, recovery mindset. SWIM focus today — celebrate the week." : "VOLUME leg day — higher reps, 90sec rest. SWIM after — 1,200–2,000m.",
    },
    Sunday: {
      label:"REST + RECOVERY", color:"#8fbc8f",
      warmup:null,
      blocks:[
        { name:"Active Recovery (Optional)", exercises:[
          { name:"Easy Walk or Light Spin",        sets:"20–30 min", load:"Zone 1 only", note:"" },
          { name:"Full Body Stretch / Yoga",        sets:"20 min",    load:"", note:"" },
          { name:"Contrast Shower or Cold Plunge",  sets:"3 rounds",  load:"3 min warm / 1 min cold", note:"" },
          { name:"Foam Roll — legs + lats",         sets:"10 min",    load:"", note:"" },
        ]},
        { name:"Nutrition Priority", exercises:[
          { name:"Hit protein target — 1g/lb bodyweight", sets:"—", load:"", note:"" },
          { name:"Sleep 8–9 hrs",                         sets:"—", load:"", note:"" },
          { name:"Hydration 100+ oz",                     sets:"—", load:"", note:"" },
        ]},
      ],
      note:"Recovery is where adaptation happens. Do not skip it.",
    },
  };
}

function parseQty(raw) {
  if (!raw) return 1;
  const s = raw.trim();
  // Handle fractions: 1/2, 3/4, 1/3 etc
  const fracMatch = s.match(/^(\d+)?\s*(\d+)\/(\d+)$/);
  if (fracMatch) {
    const whole = parseFloat(fracMatch[1] || "0");
    const num = parseFloat(fracMatch[2]);
    const den = parseFloat(fracMatch[3]);
    return whole + (num / den);
  }
  // Handle word fractions
  if (s === "half") return 0.5;
  if (s === "quarter") return 0.25;
  // Handle unicode fractions
  const uni = s.replace("½","0.5").replace("¼","0.25").replace("¾","0.75").replace("⅓","0.333").replace("⅔","0.667");
  return parseFloat(uni) || 1;
}

function parseFood(input) {
  const text = input.toLowerCase().trim();
  const items = [];
  const used = new Set();
  const keys = Object.keys(FOOD_DB).sort((a,b) => b.length - a.length);
  for (const key of keys) {
    if (used.has(key)) continue;
    const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // Match: optional number (including fractions like 1/2), optional unit word, then food name
    const re = new RegExp("(?:^|[,\\s])((?:\\d+\\s*)?(?:\\d+\\/\\d+|[\\d.]+|half|quarter|½|¼|¾|⅓|⅔))?\\s*(?:scoops?\\s+|cups?\\s+|slices?\\s+|oz\\s+|tbsp\\s+|pieces?\\s+|servings?\\s+)?("+escaped+")(?=[\\s,.]|$)", "i");
    const m = text.match(re);
    if (!m) continue;
    let qty = parseQty(m[1]);
    const db = FOOD_DB[key];
    // If user specified oz and db unit is "4oz", convert: 8oz / 4 = 2 servings
    const ozMatch2 = (text.slice(0,text.indexOf(key)+key.length)).match(/([\d.\/]+)\s*oz/i);
    if (ozMatch2 && db.unit && db.unit.includes("4oz")) { qty = parseQty(ozMatch2[1]) / 4; }
    else if (ozMatch2 && db.unit && db.unit === "oz") { qty = parseQty(ozMatch2[1]); }
    // If user specified lb, convert to oz then to servings: 0.5lb = 8oz / 4 = 2 servings
    const lbMatch = (text.slice(0, text.indexOf(key)+key.length)||"").match(/([\.\d\/]+)\s*(?:lb|lbs|pound|pounds)/i);
    if (lbMatch && db.unit && db.unit.includes("4oz")) { qty = (parseQty(lbMatch[1]) * 16) / 4; }
    const qtyLabel = qty === 0.5 ? "1/2" : qty === 0.25 ? "1/4" : qty === 0.75 ? "3/4" : String(Math.round(qty*100)/100);
    items.push({ name:key, quantity:qtyLabel+" x "+db.unit, cal:Math.round(db.cal*qty), pro:Math.round(db.pro*qty), carb:Math.round(db.carb*qty), fat:Math.round(db.fat*qty), sug:Math.round((db.sug||0)*qty) });
    used.add(key);
    for (const other of keys) { if (other !== key && key.includes(other)) used.add(other); }
  }
  if (!items.length) return null;
  const totals = items.reduce((a,i) => ({ cal:a.cal+i.cal, pro:a.pro+i.pro, carb:a.carb+i.carb, fat:a.fat+i.fat, sug:a.sug+(i.sug||0) }), {cal:0,pro:0,carb:0,fat:0,sug:0});
  return { items, cal:totals.cal, pro:totals.pro, carb:totals.carb, fat:totals.fat, sug:totals.sug };
}

      totalCal += n.cal; totalPro += n.pro;
      const calPct = Math.round(n.cal/t.cal*100);
      const proPct = Math.round(n.pro/t.pro*100);
      out += d+" ("+W[week].tag+"):\n";
      out += "  Calories: "+n.cal+" / "+t.cal+" ("+calPct+"%)\n";
      out += "  Protein:  "+n.pro+"g / "+t.pro+"g ("+proPct+"%)\n";
      out += "  Carbs:    "+n.carb+"g / "+t.carb+"g\n";
      out += "  Fat:      "+n.fat+"g / "+t.fat+"g\n";
      out += "  Sugar:    "+(n.sug||0)+"g\n";
      out += "  Water:    "+(n.water||0)+"oz\n";
      if (n.meals && n.meals.length > 0) {
        out += "  Meals:\n";
        n.meals.forEach(m => { out += "    ["+m.time+"] "+m.desc+" — "+m.cal+"cal / "+m.pro+"g P / "+m.carb+"g C / "+m.fat+"g F"+(m.sug?" / "+m.sug+"g sugar":"")+"\n"; });
      }
      out += "\n";
    });
    if (daysLogged > 0) {
      out += "--- WEEK TOTALS ("+daysLogged+" days logged) ---\n";
      out += "Avg daily calories: "+Math.round(totalCal/daysLogged)+"\n";
      out += "Avg daily protein:  "+Math.round(totalPro/daysLogged)+"g\n";
    }
    out += "\n--- STRENGTH (est. 1RM basis) ---\n";
    out += "Squat working: 275lb | Est 1RM: 310lb | W8 target: 340lb\n";
    out += "DB Press working: 100lb/hand | Est 1RM: 115lb | W8 target: 120lb\n";
    out += "Deadlift working: 315lb | Est 1RM: 355lb | W8 target: 390lb\n";
    if (weights.length > 0) {
      out += "\n--- BODYWEIGHT ---\n";
      weights.forEach(e => { out += e.date+": "+e.w+"lb\n"; });
    }
    navigator.clipboard.writeText(out).then(() => { setCopied(true); setTimeout(() => setCopied(false), 3000); });
  }

function Stopwatch() {
  const [displayMs, setDisplayMs] = useState(0);
  const [running, setRunning] = useState(false);
  const startTimeRef = React.useRef(null);  // when START was pressed
  const accumulatedRef = React.useRef(0);   // ms accumulated before last STOP
  const intervalRef = React.useRef(null);

  useEffect(() => {
    if (running) {
      startTimeRef.current = Date.now();
      intervalRef.current = setInterval(() => {
        const elapsed = accumulatedRef.current + (Date.now() - startTimeRef.current);
        setDisplayMs(elapsed);
      }, 100);
    } else {
      clearInterval(intervalRef.current);
      // Save accumulated time so RESUME picks up where we left off
      if (startTimeRef.current !== null) {
        accumulatedRef.current += Date.now() - startTimeRef.current;
        startTimeRef.current = null;
      }
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const reset = () => {
    setRunning(false);
    clearInterval(intervalRef.current);
    accumulatedRef.current = 0;
    startTimeRef.current = null;
    setDisplayMs(0);
  };

  const total = displayMs;
  const mins = String(Math.floor(total / 60000)).padStart(2,"0");
  const secs = String(Math.floor((total % 60000) / 1000)).padStart(2,"0");
  const cent = String(Math.floor((total % 1000) / 10)).padStart(2,"0");

  return (
    <div style={{ background:"#111a15", border:"1px solid #2a2a40", borderRadius:6, padding:"10px 14px", marginBottom:12, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
      <div style={{ display:"flex", alignItems:"baseline", gap:2 }}>
        <span style={{ fontSize:28, fontWeight:700, color:running?"#7bc67e":"#fff", fontFamily:"monospace", letterSpacing:"0.05em", lineHeight:1 }}>{mins}:{secs}</span>
        <span style={{ fontSize:14, color:"#4a7050", fontFamily:"monospace" }}>.{cent}</span>
      </div>
      <div style={{ display:"flex", gap:8 }}>
        <button onClick={() => setRunning(r => !r)} style={{ padding:"8px 20px", background:running?"#e05c3a":"#7bc67e", color:"#000", border:"none", borderRadius:4, cursor:"pointer", fontSize:12, fontWeight:700, fontFamily:"monospace", minWidth:72 }}>
          {running ? "STOP" : displayMs > 0 ? "RESUME" : "START"}
        </button>
        <button onClick={reset} style={{ padding:"8px 14px", background:"transparent", color:"#4a7050", border:"1px solid #2a2a40", borderRadius:4, cursor:"pointer", fontSize:12, fontFamily:"monospace" }}>
          RESET
        </button>
      </div>
    </div>
  );
}
